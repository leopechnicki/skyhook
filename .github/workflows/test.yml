# SKYHOOK test gate.
#
# Leo tests the MERGED build now, not the PR - so CI is the only thing standing
# between a regression and main. Every check here must be able to fail; a green
# tick that cannot go red is worse than no tick at all, because it is believed.
#
# Two jobs, split by cost so a broken world-stream is known in ~40s instead of
# waiting on a browser download:
#   logic    pure Node. Golden world stream, the balance gate and the input
#            latency gate. No browser.
#   browser  real Chromium via Playwright. Full game loop + frame-time harness.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  # deploy.yml calls this workflow instead of restating its steps. A deploy
  # gate that is a COPY of the test gate is a gate that silently stops
  # matching it; this way there is exactly one definition of "the suite
  # passed", and adding a test here automatically strengthens the deploy.
  workflow_call:

# A newer push to the same branch makes the older run irrelevant - cancel it.
# Never cancel main: those runs are the record of what actually landed.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  logic:
    name: logic (world + balance + latency)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The world is generated from one seeded RNG chain, so a single stray
      # rand() call silently regenerates the entire game. This asserts the
      # generated stream byte-for-byte against a golden fixture. Sub-second.
      - name: World stream (physics unchanged)
        run: node test/world.mjs

      # --ci is what makes this a gate rather than a printout: it exits
      # non-zero on losability failure only. The long-standing "skill gradient
      # TOO FLAT" readout is reported as a warning and does NOT fail the build
      # - it is an open tuning question, not a regression any PR introduced.
      - name: Balance gate
        run: node test/balance.mjs --ci

      # "It feels laggy" is not a bug report a diff can answer, so the four
      # causes behind it are each measured in ms on the real game logic:
      # input swallowed by the hitstop freeze, input deleted by the gameplay
      # debounce, the drawn hull lagging the true launch vector, and the
      # target lock being a gradient instead of an event. Every one of those
      # is a TUNED CONSTANT, which is exactly the kind of thing a later
      # "harmless" tweak puts back without anyone noticing. Pure Node,
      # sub-second, exits non-zero on regression.
      - name: Input latency gate
        run: node test/latency.mjs

      # The account layer's wire protocol, in a vm sandbox with a scripted
      # fetch - no browser, no network, under a second. The first assertions
      # it makes are the ones that matter most: with no js/config.js the game
      # makes ZERO requests and behaves exactly as it did before accounts
      # existed. It also greps supabase/schema.sql for the security rules
      # (RLS on, scores never updatable or deletable, a rename fenced by both
      # a policy and a column grant, no email in the public view), because a
      # threat model nothing checks is a comment.
      - name: Online layer (offline default + RLS rules)
        run: node test/online.mjs

      # The one canonical origin, both halves of it. index.html has to DECLARE
      # https://skyhookplay.com rather than have nginx correct it on the way
      # out, and pages/ has to redirect the retired GitHub Pages URL there
      # while carrying the query string and the hash - because ?seed=123 picks
      # a world and a Supabase auth callback arrives as ?code= or
      # #access_token=. A redirect that drops either looks like it works and
      # breaks sign-in. Pure Node, no browser, sub-second.
      - name: Canonical origin + Pages redirect stub
        run: node test/pages_stub.mjs

      # The Android wrapper's two pure-logic modules: the interstitial cadence
      # gate and the AdMob consent/targeting path. Both are dependency-free
      # (node: builtins + relative imports only), so they run here with no
      # `npm ci` in android-app/ and no Android SDK - which is the whole reason
      # they are in the cheap `logic` job rather than a native build job.
      #
      # They are gated at all because android-app/ landed as one commit of
      # previously-untracked code: the ad cadence decides how often a player is
      # interrupted, and the consent path is the difference between a compliant
      # ad request and a policy strike. Neither should be able to regress
      # silently just because the native build is not run in CI.
      - name: Android wrapper logic (ad cadence + consent)
        run: node android-app/src/test/ad-gate.test.mjs && node android-app/src/test/ads-consent.test.mjs

  browser:
    name: browser (smoke + frame time)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --with-deps pulls the system libraries headless Chromium needs on a
      # bare runner. The tests prefer a local Google Chrome and fall back to
      # this bundled Chromium, which is the path CI takes.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Drives the real game through the real input path: title -> play ->
      # score -> die -> game over -> restart -> persistence, on desktop, on a
      # 390x844 phone viewport, and from file:// with no server.
      - name: Smoke (full game loop)
        run: node test/smoke.mjs

      # The art pass only pays for itself while the whole reachable sprite set
      # fits under CACHE_MAX; one class past it and the game silently goes
      # back to repainting every sprite every frame. This asserts the real
      # reachable count against the ceiling, and that eviction is LRU.
      - name: Sprite cache ceiling
        run: node test/sprites.mjs

      # The account overlay in a real browser, against a mock Supabase served
      # from this test's own http server. Covers the shipped config-less build
      # (no button, no request, a tap where the button would be still starts a
      # run) and - the regression worth having CI for - a CONFIGURED build
      # whose backend is refusing connections: the game must still start, still
      # record a local high score, and never throw.
      - name: Leaderboard UI (incl. dead-backend fallback)
        run: node test/leaderboard_ui.mjs

      # Fails on page errors raised while rendering under 4x CPU throttling.
      # It reports frame time but deliberately does not gate on it: runner
      # timing is too noisy to threshold without making the build flaky.
      - name: Frame time (no errors under load)
        run: node test/perf.mjs

      # Screenshots are the first thing worth looking at when smoke fails.
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: test/screenshots/
          if-no-files-found: ignore
          retention-days: 7
