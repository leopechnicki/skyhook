<title>SKYHOOK</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2718%27%20r%3D%2712%27%20fill%3D%27none%27%20stroke%3D%27%2335e6ff%27%20stroke-width%3D%272%27%2F%3E%3Cpath%20d%3D%27M16%201c2.7%202.6%203.9%205.4%203.9%207.9l-1.5%201.6h-4.8l-1.5-1.6C12.1%206.4%2013.3%203.6%2016%201z%27%20fill%3D%27%23fff%27%20stroke%3D%27%2335e6ff%27%20stroke-width%3D%271.2%27%20stroke-linejoin%3D%27round%27%2F%3E%3Cpath%20d%3D%27M12.6%207.2%209.6%2011.4l3.3-1.1zM19.4%207.2l3%204.2-3.3-1.1z%27%20fill%3D%27%2335e6ff%27%2F%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%276.3%27%20r%3D%271.5%27%20fill%3D%27%2335e6ff%27%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ===== GAME STAGE ===== -->
  <div id="stage">
    <canvas id="game" width="480" height="880" aria-label="Skyhook game canvas" role="img"></canvas>
    <noscript>
      <p class="noscript">SKYHOOK needs JavaScript enabled to run.</p>
    </noscript>
  </div>

  <!-- =========================================================
       AD SLOT  -  INACTIVE / HIDDEN BY DEFAULT
       ---------------------------------------------------------
       This is the ONLY place an ad unit should ever be inserted.
       It is intentionally EMPTY: no ad network code, no publisher
       IDs, no external scripts. It is also hidden (CSS: #ad-slot
       { display: none }) so the shipped game shows no empty ad
       furniture. See README.md > "Ad slot".

       To activate: delete the `display: none` line in css/style.css,
       put the ad unit markup inside #ad-slot-inner, and add the
       network loader script at the bottom of <body>. The slot then
       reserves a fixed height (54px mobile / 96px wide) so the
       banner causes zero layout shift (CLS).
       ========================================================= -->
  <aside id="ad-slot" data-ad-slot="bottom-banner"
         data-sizes="320x50,468x60,728x90"
         aria-label="Advertisement area">
    <div id="ad-slot-inner"></div>
  </aside>

  <!-- =========================================================
       ACCOUNT / LEADERBOARD OVERLAY  -  HIDDEN BY DEFAULT
       ---------------------------------------------------------
       Real DOM rather than canvas, on purpose: this is the one
       part of SKYHOOK a player TYPES into. A canvas-drawn text
       field has no password manager, no mobile keyboard, no
       autofill, no screen reader and no focus ring. The game
       stays on the canvas; the form stays in the document.

       It sits OUTSIDE #stage so its clicks can never reach the
       game's pointer listeners, and it does not exist visually
       until js/ui_online.js is told there is a backend to talk
       to (js/config.js filled in). With no config it is inert
       markup and the game is untouched.
       ========================================================= -->
  <div id="ol" class="ol" hidden aria-hidden="true">
    <div class="ol-panel" role="dialog" aria-modal="true" aria-labelledby="ol-title">
      <button type="button" id="ol-close" class="ol-close" aria-label="Close">&#215;</button>
      <h2 id="ol-title" class="ol-title">GLOBAL LEADERBOARD</h2>

      <section id="ol-board" class="ol-view">
        <p id="ol-account" class="ol-account"></p>
        <ol id="ol-list" class="ol-list"></ol>
        <p id="ol-board-msg" class="ol-msg" role="status" aria-live="polite"></p>
        <p id="ol-myrank" class="ol-myrank"></p>
        <div class="ol-actions">
          <button type="button" id="ol-signin" class="ol-btn ol-btn-primary">SIGN IN / CREATE ACCOUNT</button>
          <button type="button" id="ol-signout" class="ol-btn" hidden>SIGN OUT</button>
        </div>
      </section>

      <section id="ol-auth" class="ol-view" hidden>
        <button type="button" id="ol-google" class="ol-btn ol-btn-google">Continue with Google</button>
        <p class="ol-or"><span>or</span></p>

        <form id="ol-form" novalidate autocomplete="on">
          <div class="ol-field" id="ol-username-field" hidden>
            <label for="ol-username">Username</label>
            <input type="text" id="ol-username" name="username" autocomplete="username"
                   maxlength="16" spellcheck="false" placeholder="3-16 letters, numbers or _">
            <!-- Not decoration. There is no UPDATE policy on profiles, by
                 design, so this name is permanent for everyone including
                 Leo. Somebody typing it deserves to know that before they
                 press the button, not after. -->
            <small class="ol-hint">This is how you appear on the board, and it cannot be changed later.</small>
          </div>
          <div class="ol-field">
            <label for="ol-email">Email</label>
            <input type="email" id="ol-email" name="email" autocomplete="email"
                   spellcheck="false" placeholder="you@example.com">
          </div>
          <div class="ol-field">
            <label for="ol-password">Password</label>
            <input type="password" id="ol-password" name="password"
                   autocomplete="current-password" placeholder="at least 8 characters">
          </div>
          <button type="submit" id="ol-submit" class="ol-btn ol-btn-primary">SIGN IN</button>
        </form>

        <p id="ol-auth-msg" class="ol-msg" role="alert"></p>
        <div class="ol-links">
          <button type="button" id="ol-toggle" class="ol-link">Create an account</button>
          <button type="button" id="ol-back" class="ol-link">Back to leaderboard</button>
        </div>
      </section>
    </div>
  </div>

</div>

<!-- config.js first: it only sets a global, and js/online.js reads it. It is
     empty in the repo, which is what keeps the default build offline. -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/audio.js"></script>
<script src="js/celestial.js"></script>
<script src="js/rocket.js"></script>
<script src="js/game.js"></script>
<script src="js/online.js"></script>
<script src="js/main.js"></script>
<!-- Last: needs both SK.Online and the game instance main.js creates. -->
<script src="js/ui_online.js"></script>
<!-- Ad network loader script (e.g. AdSense) would go here, after the game scripts. -->
</body>
</html>
