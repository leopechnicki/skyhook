# GitGuardian configuration for SKYHOOK.
#
# TWO ignore rules, for TWO strings: the Supabase *anon* key of each project.
# js/config.js carries production's and staging/config.staging.js carries
# staging's, and since 2026-09-23 those are two different Supabase projects and
# therefore two different keys. Until then there was one rule, because the two
# files held the same string.
#
# That is the one cost of ignoring a MATCH rather than a PATH, and it is the
# cost worth paying - see "Why this ignores a MATCH" below. A path ignore would
# have needed no edit here, and would have bought that convenience by going
# blind to every future secret in both files.
#
# Nothing else is suppressed, and the scanner is not disabled anywhere.
#
# ---------------------------------------------------------------------------
# Why that key is committed, and why it is not a leak
# ---------------------------------------------------------------------------
# SKYHOOK is a static site served by GitHub Pages straight from `main` (no
# build step, no bundler, no deploy-time substitution - that is the point of
# the project). A config file that is not committed therefore does not exist
# on the live site. The key has to be in the repo for the game to have a
# leaderboard at all.
#
# That is fine, because the anon key is PUBLIC BY DESIGN. It is the string
# Supabase labels "anon / public", it is shipped to every browser that loads
# the page, and it identifies the project - not a person and not a privilege.
# Decoded, its payload is:
#
#     {"iss":"supabase","ref":"ievfcqnyrekdixxbsite","role":"anon",...}   <- production
#     {"iss":"supabase","ref":"qlaenczyhzjkmqkraiup","role":"anon",...}   <- staging
#
# `role: anon` is the whole story. Every byte of authority it carries is
# granted by Row Level Security in supabase/schema.sql, which is why that file
# exists: RLS on for `scores` and `profiles`, insert restricted to
# `user_id = auth.uid()`, no UPDATE policy, no DELETE policy, update/delete
# revoked outright, rate limiting in a BEFORE INSERT trigger, and a
# security_invoker public view that exposes no email column. Handing this key
# to an attacker gives them exactly what it gives an ordinary player: the
# ability to read the public board and to write rows as themselves.
#
# GitGuardian's finding is a true positive as a *detection* - it really is a
# JWT - and a false positive as an *incident*. There is nothing to rotate and
# nothing to revoke.
#
# The genuinely dangerous key is `service_role`, which bypasses RLS entirely.
# Both keys are JWTs issued by the same project and differ only by one claim
# buried inside base64, so they look nearly identical to a human and to a
# grep. test/online.mjs therefore base64-decodes whatever key is committed and
# fails the build unless its role claim is literally "anon".
#
# ---------------------------------------------------------------------------
# Why this ignores a MATCH and not the PATH
# ---------------------------------------------------------------------------
# `ignored_paths: js/config.js` would have been shorter and is the wrong tool.
# It would blind the scanner to *every future secret* in that file - including
# the one mistake that would actually matter here, someone pasting the
# service_role key into the slot right next to this one. Ignoring the specific
# string keeps js/config.js scanned: any other secret in it still fires.
#
# The trade-off, stated honestly: a new project means a new string means a new
# entry below. That is a real edit a path ignore would not have needed. What it
# buys is that both config files stay fully scanned - if somebody pastes the
# service_role key into either one, GitGuardian still fires, and a path ignore
# is exactly the rule that would have swallowed it.
#
# test/staging.mjs decodes the staging key and fails the build unless its role
# claim is literally "anon", exactly as test/online.mjs does for production's.
# Since the split it also fails the build if the staging key's `ref` claim is
# production's project, which is the mistake a role check cannot see: a
# production key under a staging URL is still a role-"anon" key.
#
# ---------------------------------------------------------------------------
# Scope: what this file is known to affect, and what it may not
# ---------------------------------------------------------------------------
# `ggshield` (CLI, pre-commit hook, ggshield CI action) definitely reads this
# config. That much is documented.
#
# The GitGuardian GitHub App - the thing that posts the "GitGuardian Security
# Checks" run on pull requests - is less clear-cut, so here is the evidence
# rather than a claim:
#
#   - GitGuardian's own docs describe that check as driven by INCIDENT STATUS
#     in the dashboard, and never mention this file. Read literally, that says
#     the check can only be silenced by closing the incident in the dashboard.
#   - Observed on the PR that added this file: the commit introducing it was
#     scanned and came back "No secrets detected", even though the anon key
#     appears VERBATIM below. On the previous PR, the same key in
#     js/config.js failed the same check.
#
# So the observed behaviour is consistent with this file being honoured, but a
# second explanation fits too: GitGuardian may simply not re-raise a secret it
# has already opened an incident for (37342244). Those two cannot be told
# apart from here without dashboard access.
#
# Practical upshot - do not treat this file as the thing keeping the check
# green. If the check goes red again on a future PR for this same key, that is
# the second explanation winning, and the fix is one click in the dashboard:
# close incident 37342244 as a false positive. Nothing needs rotating.
#
# EXPECT EXACTLY THAT ON THE PR THAT ADDS THE STAGING KEY BELOW. Whichever of
# the two explanations is true, a brand-new string has never been scanned and
# has no incident yet, so the GitHub App will raise a NEW one. The entry below
# cannot prevent it: the App scans server-side, and on the evidence above it
# may not read this file at all. This is not a rotation and not a leak - it is
# a second public anon key doing what the first one did. Leo closes the new
# incident as a false positive in the dashboard; that is a click nobody else
# can make for him.

version: 2

secret:
  ignored_matches:
    # PRODUCTION - Supabase anon (public) key for project ievfcqnyrekdixxbsite.
    # Listed as the literal value rather than an ignore-sha so the rule stays
    # readable and stays pinned to this exact key: rotate the project and this
    # entry stops matching, which is the correct behaviour.
    - name: 'SKYHOOK Supabase anon (public) key - constrained by RLS, see supabase/schema.sql'
      match: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlldmZjcW55cmVrZGl4eGJzaXRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NzQ0MjYsImV4cCI6MjEwNTE1MDQyNn0.DPaeAv6WFnAQMomXQzlMWZulkM12jqicrymSInQygOM

    # STAGING - Supabase anon (public) key for project qlaenczyhzjkmqkraiup.
    # A different project from production since 2026-09-23, so a different key
    # and its own entry; see the header for why that is not a reason to switch
    # to a path ignore. Same reasoning applies to it in full: role "anon",
    # public by design, shipped to every browser that loads the staging page,
    # and constrained entirely by the RLS in supabase/schema.sql - the same
    # schema file, applied to the staging project.
    - name: 'SKYHOOK STAGING Supabase anon (public) key - constrained by RLS, see supabase/schema.sql'
      match: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsYWVuY3p5aHpqa21xa3JhaXVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMTI2MzEsImV4cCI6MjEwNTY4ODYzMX0.L_DGdRS9H5ru49J4Jda5XFsAw1GljB3sAn5Q1qfC75I
