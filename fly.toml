# SKYHOOK on Fly.io.
#
# Mirrors the pattern already proven on leopechnicki/safirdj (same region, same
# auto-stop machine economics, same GitHub Actions `flyctl deploy --remote-only`
# on push to main). The difference is what is behind the port: safirdj runs a
# Node server, SKYHOOK is a folder of static files behind nginx, so there is no
# application process to keep warm and no state to lose when a machine stops.
#
# The app is live: `skyhook-game` in org personal, region ams, with a
# deploy-scoped FLY_API_TOKEN already set as a repo secret. The plain name
# `skyhook` was taken - Fly app names are one global namespace. docs/DEPLOY.md.

app = 'skyhook-game'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  # The public origin, as the meta tags should report it. conf/site.conf.template
  # rewrites <link rel=canonical>, og:url and og:image to this at serve time.
  #
  # The custom domain now exists: skyhookplay.com, registered on GoDaddy
  # 2026-09-19. Fly certs are already requested for both skyhookplay.com and
  # www.skyhookplay.com and go Ready once the GoDaddy records listed in
  # docs/DEPLOY.md are in place.
  #
  # THIS LINE IS ONLY TRUE ONCE THAT CERT IS READY. Until the DNS is live,
  # deploying this value makes <link rel=canonical> advertise a hostname that
  # does not resolve, so the change that sets it must not merge before
  # `fly certs check skyhookplay.com -a skyhook-game` says Ready.
  #
  # skyhook-game.fly.dev keeps working either way - Fly assigns it at app
  # creation and it is what .github/workflows/deploy.yml verifies against.
  SITE_ORIGIN = 'https://skyhookplay.com'

[http_service]
  internal_port = 8080
  force_https = true

  # A static site has no warm state, so stopping an idle machine costs the next
  # player a cold start of a few hundred ms and costs Leo nothing per hour.
  # min_machines_running = 0 is the right setting for a game nobody is playing
  # at 04:00; it would be the wrong setting for something holding a session.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '5s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  # nginx serving ~1 MB of static files out of the page cache. 256 MB is
  # already generous; the smallest shared CPU is the correct size and anything
  # larger is paying for idle.
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
